name: Rename file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename HTML file to index.html
        run: |
          git config user.name "UnderDogRecords"
          git config user.email "jesus.walk0352@gmail.com"
          git mv underdogrecords-gong-shi-saito.html index.html
          git commit -m "Rename uploaded file to index.html"
          git push
